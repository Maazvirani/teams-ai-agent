# Render.com Blueprint — deploys V.I.R.A.N.I. from GitHub with no terminal.
# In Render:  New +  →  Blueprint  →  connect this repository.
# Render reads this file, creates the service, then asks you to fill in the
# values marked "sync: false" in its dashboard. See docs/SETUP.md.

services:
  - type: web
    name: virani
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # --- Required: your PIN and a session secret -----------------------
      - key: OWNER_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true

      # --- Required: the free AI brain -----------------------------------
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

      # --- Who you are ----------------------------------------------------
      - key: OWNER_NAME
        sync: false
      - key: OWNER_TIMEZONE
        value: Asia/Karachi
      - key: OWNER_CITY
        value: Karachi
      - key: WAKE_WORD
        value: virani

      # --- Memory (switch to "upstash" once you have a free database) -----
      - key: MEMORY_BACKEND
        value: file
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # --- Your public address, e.g. https://virani.onrender.com ----------
      - key: PUBLIC_URL
        sync: false

      # --- Optional: Gmail + Calendar -------------------------------------
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Optional: automatic morning briefing, e.g. 07:30 ---------------
      - key: DAILY_BRIEFING_TIME
        sync: false

      # --- Push notification keys (generated on first boot if left blank) -
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
